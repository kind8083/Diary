<!doctype html>
<html lang="ru">
<head>
<meta charset=utf8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дневник ДЗ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: тетрадный лист в клетку; сверху форма записи, ниже задания по срокам в группах-«страницах». */
:root {
  --font-display: 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive;
  --font-body: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  --bg: #EEF2F9;
  --grid: #DCE4F2;
  --panel: #FFFFFF;
  --ink: #18203A;
  --ink2: #55607E;
  --line: #DDE3F0;
  --accent: #2B47D6;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4E9FD;
  --bad: #C8222D;
  --bad-soft: #FDE8EA;
  --warn: #9A4A06;
  --warn-soft: #FEF0D9;
  --ok: #17803D;
  --onc: #FFFFFF;
  --c0: #2B47D6; --c1: #C8222D; --c2: #0F8A6A; --c3: #B45309;
  --c4: #8A3FC4; --c5: #0E7C9C; --c6: #C2307A; --c7: #5B6B2A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1322; --grid: #171E33; --panel: #161C30; --ink: #E7EBF8; --ink2: #9AA4C2; --line: #262E48;
    --accent: #8CA0FF; --accent-ink: #0E1322; --accent-soft: #222B52;
    --bad: #FF8A91; --bad-soft: #3A1D26; --warn: #F2B35A; --warn-soft: #3A2D16; --ok: #5FD08A; --onc: #0E1322;
    --c0: #8CA0FF; --c1: #FF8A91; --c2: #4FD1A5; --c3: #F2B35A;
    --c4: #C99BF2; --c5: #5CC8E6; --c6: #F58CBE; --c7: #B8C86A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1322; --grid: #171E33; --panel: #161C30; --ink: #E7EBF8; --ink2: #9AA4C2; --line: #262E48;
  --accent: #8CA0FF; --accent-ink: #0E1322; --accent-soft: #222B52;
  --bad: #FF8A91; --bad-soft: #3A1D26; --warn: #F2B35A; --warn-soft: #3A2D16; --ok: #5FD08A; --onc: #0E1322;
  --c0: #8CA0FF; --c1: #FF8A91; --c2: #4FD1A5; --c3: #F2B35A;
  --c4: #C99BF2; --c5: #5CC8E6; --c6: #F58CBE; --c7: #B8C86A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font: 15px/1.45 var(--font-body);
  padding-block: 20px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { flex: none; }

/* Шапка */
.head { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.head h1 { font: 700 clamp(40px, 9vw, 56px)/1 var(--font-display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
.sum { color: var(--ink2); margin: 0; }
.sum b { color: var(--ink); font-weight: 600; }
.sum .bad { color: var(--bad); font-weight: 600; }

/* Напоминания-баннеры */
.alerts { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-direction: column; gap: 8px; }
.alerts:empty { display: none; }
.alert { background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 20px rgba(10, 20, 60, .22); animation: drop .25s ease-out; }
.alert .k { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
.alert .t { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.alert .s { font-size: 13px; opacity: .92; }
.alert .ab { display: flex; flex-wrap: wrap; gap: 8px; }
.abtn { background: var(--accent-ink); color: var(--accent); border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 600; min-height: 38px; }
.abtn.ghost { background: transparent; color: var(--accent-ink); box-shadow: inset 0 0 0 1px currentColor; }
@keyframes drop { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Панель настроек напоминаний */
.rbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 13px; color: var(--ink2); }
.rbar p { margin: 0; flex: 1 1 260px; min-width: 0; }
.mini { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 34px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.mini:hover { border-color: var(--accent); }

/* Форма */
.compose { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.compose h2 { margin: 0; font: 700 28px/1 var(--font-display); }
.compose textarea { width: 100%; resize: vertical; min-height: 64px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.compose textarea::placeholder { color: var(--ink2); opacity: .8; }
.hint { font-size: 12px; color: var(--ink2); margin: -8px 0 0; }
.err { color: var(--bad); font-size: 13px; margin: -8px 0 0; font-weight: 500; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; min-height: 36px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.subj i { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); flex: none; }
.chip.subj[aria-pressed="true"] { background: var(--tc); border-color: var(--tc); color: var(--onc); }
.chip.subj[aria-pressed="true"] i { background: var(--onc); }
.chip.add { border-style: dashed; }
.chip-input { border: 1px solid var(--accent); background: var(--bg); border-radius: 999px; padding: 6px 12px; min-height: 36px; width: 180px; max-width: 100%; }
.dt { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dt input { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; font-variant-numeric: tabular-nums; }
.acts-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 16px; min-height: 44px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding-inline: 22px; }
.btn.primary:hover { filter: brightness(1.08); }

.seg { display: inline-flex; align-self: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--bg); }
.seg button { border: 0; background: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; min-height: 38px; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.kind { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 2px 8px; border-radius: 6px; }
.sep { width: 1px; background: var(--line); margin: 4px 2px; }
.fab { position: fixed; z-index: 15; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 0 20px; min-height: 52px; font-weight: 700; box-shadow: 0 8px 24px rgba(10, 20, 60, .3); }

/* Примеры */
.exbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.exbar button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 6px 10px; min-height: 34px; font-weight: 600; }

/* Вкладки и фильтр */
.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); background: var(--bg); padding-inline: 2px; }
.tab { background: none; border: 0; padding: 10px 2px; font-weight: 600; color: var(--ink2); border-bottom: 3px solid transparent; margin-bottom: -1px; min-height: 44px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab span { color: var(--ink2); font-weight: 500; margin-left: 4px; font-variant-numeric: tabular-nums; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters .chip { font-size: 13px; padding: 4px 10px; min-height: 32px; }

/* Список */
.grp { display: flex; flex-direction: column; gap: 6px; }
.gh { margin: 0; font: 700 28px/1.1 var(--font-display); display: flex; align-items: baseline; gap: 8px; }
.gh span { font: 500 13px var(--font-body); color: var(--ink2); }
.gh.over { color: var(--bad); }
.rows { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: flex-start; gap: 2px; padding: 6px 8px 6px 2px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.fresh { animation: fresh 1.6s ease-out; }
@keyframes fresh { from { background: var(--accent-soft); } to { background: transparent; } }
.check { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; flex: none; }
.box { width: 24px; height: 24px; border: 2px solid var(--ink2); border-radius: 7px; display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
.check:hover .box { border-color: var(--ok); }
.row.done .box { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.body { flex: 1; min-width: 0; padding: 9px 0 6px; display: flex; flex-direction: column; gap: 5px; }
.txt { font-size: 16px; overflow-wrap: anywhere; white-space: pre-wrap; }
.row.done .txt { text-decoration: line-through; color: var(--ink2); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--ink2); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink); }
.tag i { width: 9px; height: 9px; border-radius: 50%; background: var(--tc); }
.when { font-variant-numeric: tabular-nums; }
.rel { font-weight: 600; font-variant-numeric: tabular-nums; }
.rel.over { color: var(--bad); background: var(--bad-soft); padding: 1px 8px; border-radius: 999px; }
.rel.soon { color: var(--warn); background: var(--warn-soft); padding: 1px 8px; border-radius: 999px; }
.bells { display: inline-flex; align-items: center; gap: 4px; }
.ra { display: flex; flex: none; }
.ib { width: 40px; height: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--ink2); border-radius: 8px; }
.ib:hover { color: var(--accent); }
.ib.del:hover { color: var(--bad); }
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 14px; padding: 28px 16px; text-align: center; color: var(--ink2); }
.clear { align-self: flex-start; }
.foot { font-size: 12px; color: var(--ink2); text-align: center; }

/* Тост с отменой */
.toast { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.toast div { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
.toast button { background: none; border: 0; color: var(--bg); font-weight: 700; text-decoration: underline; padding: 4px; min-height: 32px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .alert, .row.fresh { animation: none; } }
@media (max-width: 420px) { .compose { padding: 14px; } .ib { width: 36px; } }
</style>

<div class="wrap">
  <header class="head">
    <h1>Дневник ДЗ</h1>
    <p class="sum" id="sum"></p>
  </header>

  <div class="alerts" id="alerts" aria-live="polite"></div>

  <div class="rbar">
    <p id="rnote"></p>
    <button class="mini" data-act="sys" id="b-sys"></button>
    <button class="mini" data-act="sound" id="b-sound"></button>
    <button class="mini" data-act="test">Проверить</button>
  </div>

  <section class="compose" aria-labelledby="c-title">
    <h2 id="c-title">Новое задание</h2>
    <div class="seg" id="f-type" role="group" aria-label="Тип записи"></div>
    <div class="field">
      <label class="sr" for="f-text">Что задали</label>
      <textarea id="f-text" rows="2" placeholder="Что задали? Например: № 345–350, параграф 12" autocomplete="off"></textarea>
    </div>
    <p class="hint">Enter добавляет задание, Shift+Enter переносит строку.</p>
    <p class="err" id="e-text" hidden></p>

    <div class="field">
      <span class="lbl">Предмет</span>
      <div class="chips" id="f-subjects"></div>
    </div>

    <div class="field">
      <span class="lbl" id="l-due">Срок сдачи</span>
      <div class="dt">
        <label class="sr" for="f-date">Дата</label><input type="date" id="f-date">
        <label class="sr" for="f-time">Время</label><input type="time" id="f-time">
      </div>
      <div class="chips" id="f-qd"></div>
      <div class="chips" id="f-qt"></div>
      <p class="err" id="e-date" hidden></p>
    </div>

    <div class="field">
      <span class="lbl">Напомнить</span>
      <div class="chips" id="f-rem"></div>
    </div>

    <div class="acts-row">
      <button class="btn primary" data-act="add" id="f-add">Добавить</button>
      <button class="btn" data-act="cancel" id="f-cancel" hidden>Отмена</button>
    </div>
  </section>

  <div class="exbar" id="exbar" hidden>
    <span>Часть записей ниже — примеры, чтобы было видно, как всё работает.</span>
    <button data-act="rmex">Убрать примеры</button>
  </div>

  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="filters" id="filters"></div>
  <div id="list"></div>

  <p class="foot">Задания хранятся в этом браузере. Напоминания срабатывают, пока страница открыта.</p>
</div>
<div class="toast" id="toast" hidden></div>
<button class="fab" id="fab" data-act="fab" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Записать</button>

<script>
(function () {
  'use strict';
  var KEY = 'dz.v1';
  var SUBJ = ['Математика', 'Русский язык', 'Физика', 'Литература', 'Информатика', 'Английский', 'История'];
  var REM = [[0, 'В срок'], [15, 'За 15 мин'], [60, 'За 1 час'], [180, 'За 3 часа'], [1440, 'За 1 день'], [4320, 'За 3 дня']];
  var DEF_REM = { hw: [60, 1440], test: [4320, 1440, 60] };
  var QT = ['08:00', '14:00', '18:00', '23:59'];
  var QD = [[0, 'Сегодня'], [1, 'Завтра'], [2, 'Послезавтра'], [7, 'Через неделю']];

  var ICONS = {
    bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>'
  };
  function ico(n, s) {
    s = s || 16;
    return '<svg class="ico" viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';
  }

  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function plural(n, a, b, c) { var m = Math.abs(n) % 100, d = m % 10; if (m > 10 && m < 20) return c; if (d === 1) return a; if (d > 1 && d < 5) return b; return c; }
  function ymd(ts) { var d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function hm(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function sod(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function addDays(ts, n) { var d = new Date(ts); d.setDate(d.getDate() + n); return d.getTime(); }
  function dayDiff(ts) { return Math.round((sod(ts) - sod(Date.now())) / 86400000); }

  var wdFmt = null;
  try { wdFmt = new Intl.DateTimeFormat('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' }); } catch (e) {}
  function dayLabel(ts) {
    var d = dayDiff(ts);
    if (d === 0) return 'сегодня';
    if (d === 1) return 'завтра';
    if (d === 2) return 'послезавтра';
    if (d === -1) return 'вчера';
    return wdFmt ? wdFmt.format(ts) : ymd(ts);
  }
  function whenLabel(ts) { return dayLabel(ts) + ', ' + hm(ts); }
  function span(m) {
    if (m < 1) return '';
    if (m < 60) return m + ' мин';
    if (m < 1440) { var h = Math.floor(m / 60), mm = m % 60; return h + ' ч' + (mm && h < 6 ? ' ' + mm + ' мин' : ''); }
    var dd = Math.floor(m / 1440), hh = Math.round((m % 1440) / 60);
    return dd + ' ' + plural(dd, 'день', 'дня', 'дней') + (dd < 3 && hh ? ' ' + hh + ' ч' : '');
  }
  function relLabel(ts) {
    var diff = ts - Date.now(), m = Math.round(Math.abs(diff) / 60000), s = span(m);
    if (!s) return 'сейчас';
    return diff < 0 ? 'просрочено на ' + s : 'через ' + s;
  }
  function remLabel(r) {
    if (r === 0) return 'в срок';
    if (r < 60) return 'за ' + r + ' мин';
    if (r < 1440) return 'за ' + (r / 60) + ' ч';
    var dn = r / 1440;
    return 'за ' + dn + ' ' + plural(dn, 'день', 'дня', 'дней');
  }

  /* ---------- состояние ---------- */
  function markPast(t) {
    var now = Date.now();
    t.fired = t.fired || {};
    t.rem.forEach(function (r) { if (t.due - r * 60000 <= now) t.fired[r] = 1; });
  }
  function mk(subject, text, due, rem, type) {
    var t = { id: uid(), subject: subject, text: text, due: due, rem: rem, fired: {}, done: false, ex: true, type: type || 'hw' };
    markPast(t);
    return t;
  }
  function seed() {
    var now = Date.now();
    function at(days, h, m) { var d = new Date(now); d.setDate(d.getDate() + days); d.setHours(h, m, 0, 0); return d.getTime(); }
    var soon = Math.ceil((now + 4 * 3600000) / 300000) * 300000;
    return {
      v: 1,
      tasks: [
        mk('Математика', '№ 345–350, параграф 12', at(1, 8, 30), [60, 1440]),

        return;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.target.id === 'f-text' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
    if (e.target.id === 'new-sub') {
      if (e.key === 'Enter') {
        e.preventDefault();
        var n = e.target.value.trim();
        if (n) {
          var ex = S.subjects.filter(function (s) { return s.n.toLowerCase() === n.toLowerCase(); })[0];
          if (!ex) { ex = { n: n, c: S.subjects.length % 8 }; S.subjects.push(ex); persist(); }
          F.subject = ex.n;
        }
        $('#f-subjects')._h = null; renderChips(); render();
      } else if (e.key === 'Escape') { $('#f-subjects')._h = null; renderChips(); }
    }
  });
  document.addEventListener('focusout', function (e) {
    if (e.target.id === 'new-sub' && !e.target.value.trim()) { setTimeout(function () { var el = $('#new-sub'); if (el && document.activeElement !== el) { $('#f-subjects')._h = null; renderChips(); } }, 100); }
  });
  $('#f-date').addEventListener('input', function () { setErr('#e-date'); renderChips(); });
  $('#f-time').addEventListener('input', function () { setErr('#e-date'); renderChips(); });
  $('#f-text').addEventListener('input', function () { setErr('#e-text'); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { tick(false); render(); } });

  /* ---------- запуск ---------- */
  $('#f-date').min = ymd(Date.now());
  $('#f-date').value = ymd(addDays(Date.now(), 1));
  $('#f-time').value = '08:00';
  if (!S.subjects.some(function (s) { return s.n === F.subject; })) F.subject = S.subjects[0].n;
  renderChips();
  tick(true);
  render();
  try {
    new IntersectionObserver(function (es) { $('#fab').hidden = es[0].isIntersecting; }).observe(document.querySelector('.compose'));
  } catch (e) {}
  setInterval(function () { tick(false); render(); }, 15000);
})();
</script>

</body></html>
